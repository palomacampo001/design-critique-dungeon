<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM Office Wayfinder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1a73e8;
      --hover:   #1557b0;
      --text:    #202124;
      --muted:   #5f6368;
      --border:  #dadce0;
      --bg:      #f1f3f4;
      --white:   #ffffff;
      --green:   #34a853;
      --red:     #ea4335;
      --yellow:  #fbbc04;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      overflow: hidden;
      height: 100vh;
    }

    /* ── Map viewport ─────────────────────────────────────────────────────── */
    #map-viewport {
      position: fixed;
      inset: 0;
      background: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #map-pan-layer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    /* The floor plan image */
    #floor-img {
      display: block;
      max-width: min(1400px, 95vw);
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      transition: opacity 0.3s ease;
      user-select: none;
    }

    /* Route + marker overlay — positioned to exactly cover the floor-img */
    #overlay-svg {
      position: absolute;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      width: 310px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.16);
      padding: 20px 18px 18px;
    }

    .sidebar h3 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar h3 .ibm-logo {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.5px;
      background: #e8f0fe;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      display: block;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    .search-wrap { position: relative; }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--blue); }

    .suggestions {
      position: absolute;
      top: calc(100% + 2px);
      left: 0; right: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 0 0 6px 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 30;
      display: none;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }
    .suggestion-row {
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f3f4;
    }
    .suggestion-row:last-child { border-bottom: none; }
    .suggestion-row:hover { background: var(--bg); }
    .floor-chip {
      font-size: 10px;
      font-weight: 700;
      background: #e8f0fe;
      color: var(--blue);
      padding: 2px 7px;
      border-radius: 10px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .route-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .route-btn:hover { background: var(--hover); }
    .route-btn:active { transform: scale(0.98); }

    /* Directions output */
    .directions {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: none;
    }
    .directions h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #3c4043;
      padding: 7px 0;
      border-bottom: 1px dashed #f1f3f4;
      line-height: 1.45;
    }
    .step:last-child { border-bottom: none; }
    .step-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: var(--blue);
      color: var(--white);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .step b { color: var(--text); }

    /* Error / status strip */
    .status-bar {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status-bar.error { background: #fce8e6; color: #c5221f; display: block; }
    .status-bar.info  { background: #e8f0fe; color: var(--blue);  display: block; }

    /* ── Floor switcher ───────────────────────────────────────────────────── */
    .floor-switcher {
      position: fixed;
      right: 16px;
      bottom: 40px;
      z-index: 20;
      display: flex;
      flex-direction: column-reverse;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .fl-btn {
      border: none;
      background: var(--white);
      color: #3c4043;
      padding: 13px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border-top: 1px solid #f1f3f4;
      transition: background 0.12s, color 0.12s;
      min-width: 54px;
      text-align: center;
    }
    .fl-btn:first-child { border-top: none; }
    .fl-btn:hover:not(.active) { background: var(--bg); }
    .fl-btn.active { background: var(--blue); color: var(--white); }

    /* ── Zoom controls ────────────────────────────────────────────────────── */
    .zoom-controls {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: var(--white);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .zoom-btn {
      border: none;
      background: var(--white);
      color: var(--text);
      padding: 10px 16px;
      font-size: 20px;
      font-weight: 300;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      line-height: 1;
      transition: background 0.12s;
    }
    .zoom-btn:last-child { border-bottom: none; }
    .zoom-btn:hover { background: var(--bg); }

    /* ── Elevator popup ───────────────────────────────────────────────────── */
    .elev-popup {
      position: fixed;
      left: 340px;
      top: 45%;
      z-index: 25;
      background: var(--white);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      font-size: 13px;
      color: var(--text);
      min-width: 180px;
      display: none;
    }
    .elev-popup.visible { display: block; }
    .elev-popup-title { font-weight: 600; margin-bottom: 6px; }
    .elev-popup-close {
      float: right;
      background: none;
      border: none;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      margin-top: -2px;
    }
    .elev-btn {
      margin-top: 8px;
      width: 100%;
      padding: 7px 10px;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .elev-btn:hover { background: var(--hover); }

    /* Loading indicator */
    #loading-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--white);
      border-radius: 8px;
      padding: 20px 28px;
      font-size: 14px;
      color: var(--muted);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 50;
      display: none;
    }
  </style>
</head>

function loadFloor(floor, callback) {
  loadingMsg.style.display = "block";
  floorImg.style.opacity = "0.4";

  floorImg.onload = () => {
    loadingMsg.style.display = "none";
    floorImg.style.opacity = "1";
    syncOverlay();
    if (callback) callback();
  };
  floorImg.onerror = () => {
    loadingMsg.style.display = "none";
    floorImg.style.opacity = "1";
    showStatus(`Could not load floor ${floor} SVG. Make sure you're running a local server (e.g. "npx serve ." in the project root).`, "error");
  };
  floorImg.src = FLOOR_SVGS[floor];
}

// Sync the overlay SVG dimensions to the rendered floor image
function syncOverlay() {
  const r = floorImg.getBoundingClientRect();
  const pr = mapPanLayer.getBoundingClientRect();
  overlaySvg.setAttribute("width",  r.width);
  overlaySvg.setAttribute("height", r.height);
  overlaySvg.setAttribute("viewBox", `0 0 1224 792`);
  overlaySvg.style.left = (r.left - pr.left) + "px";
  overlaySvg.style.top  = (r.top  - pr.top)  + "px";
  renderOverlay();
}

window.addEventListener("resize", syncOverlay);

// ── Floor switching ───────────────────────────────────────────────────────────
function switchFloor(floor, animate) {
  currentFloor = floor;
  document.querySelectorAll(".fl-btn").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.floor) === floor);
  });
  hideElevPopup();
  if (animate) flyTo(ELEVATORS[floor].x, ELEVATORS[floor].y, 1.15);
  loadFloor(floor, () => syncOverlay());
}

document.querySelectorAll(".fl-btn").forEach(btn => {
  btn.addEventListener("click", () => switchFloor(parseInt(btn.dataset.floor), false));
});

// ── Zoom & pan ────────────────────────────────────────────────────────────────
function applyZoom() {
  mapPanLayer.style.transform = `scale(${zoomScale})`;
  setTimeout(syncOverlay, 50);
}
document.getElementById("zoomIn").addEventListener("click", () => {
  zoomScale = Math.min(zoomScale + 0.2, 3.0);
  applyZoom();
});
document.getElementById("zoomOut").addEventListener("click", () => {
  zoomScale = Math.max(zoomScale - 0.2, 0.4);
  applyZoom();
});
// Mouse-wheel zoom
document.getElementById("map-viewport").addEventListener("wheel", e => {
  e.preventDefault();
  zoomScale = Math.max(0.4, Math.min(3.0, zoomScale - e.deltaY * 0.001));
  applyZoom();
}, { passive: false });

function flyTo(svgX, svgY, targetZoom) {
  // Convert SVG coords to approximate screen centre offsets
  zoomScale = targetZoom || 1.3;
  applyZoom();
}

// ── Overlay rendering ─────────────────────────────────────────────────────────
function renderOverlay() {
  while (overlaySvg.firstChild) overlaySvg.removeChild(overlaySvg.firstChild);
  if (!route) return;

  // Draw route legs on current floor
  route.legs.forEach(leg => {
    if (leg.floor !== currentFloor) return;
    // Glow / shadow
    const shadow = makeLine(leg.from.x, leg.from.y, leg.to.x, leg.to.y,
      "rgba(26,115,232,0.25)", 14, null, "round");
    overlaySvg.appendChild(shadow);
    // Dashed blue line
    const line = makeLine(leg.from.x, leg.from.y, leg.to.x, leg.to.y,
      "#1a73e8", 5, "18 9", "round");
    overlaySvg.appendChild(line);
    // Animated dash pulse via CSS animation trick
    line.style.animation = "dash-anim 1.2s linear infinite";
  });

  // Draw markers
  LOCATIONS.forEach(loc => {
    if (loc.floor !== currentFloor) return;
    const isStart = route && route.startId === loc.id;
    const isEnd   = route && route.endId   === loc.id;
    if (!isStart && !isEnd) return;
    const color  = isStart ? "#34a853" : "#ea4335";
    const label  = isStart ? "A" : "B";
    drawPin(loc.x, loc.y, color, label);
  });

  // Elevator marker if cross-floor
  if (route && route.crossFloors) {
    const elv = ELEVATORS[currentFloor];
    if (elv) drawElevatorPin(elv.x, elv.y);
  }
}

function makeLine(x1, y1, x2, y2, stroke, width, dasharray, cap) {
  const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
  l.setAttribute("x1", x1); l.setAttribute("y1", y1);
  l.setAttribute("x2", x2); l.setAttribute("y2", y2);
  l.setAttribute("stroke", stroke);
  l.setAttribute("stroke-width", width);
  l.setAttribute("stroke-linecap", cap || "round");
  if (dasharray) l.setAttribute("stroke-dasharray", dasharray);
  return l;
}

function drawPin(x, y, color, letter) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  // Drop shadow
  const sh = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  sh.setAttribute("cx", x + 2); sh.setAttribute("cy", y + 2);
  sh.setAttribute("r", 13);
  sh.setAttribute("fill", "rgba(0,0,0,0.18)");
  // Pin circle
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y);
  c.setAttribute("r", 13);
  c.setAttribute("fill", color);
  c.setAttribute("stroke", "#ffffff");
  c.setAttribute("stroke-width", 2.5);
  // Label
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x); t.setAttribute("y", y + 5);
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("font-family", "Arial, sans-serif");
  t.setAttribute("font-size", "13");
  t.setAttribute("font-weight", "700");
  t.setAttribute("fill", "#ffffff");
  t.textContent = letter;
  g.appendChild(sh); g.appendChild(c); g.appendChild(t);
  overlaySvg.appendChild(g);
}

function drawElevatorPin(x, y) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const sh = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  sh.setAttribute("cx", x+2); sh.setAttribute("cy", y+2);
  sh.setAttribute("r", 12); sh.setAttribute("fill", "rgba(0,0,0,0.15)");
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y);
  c.setAttribute("r", 12);
  c.setAttribute("fill", "#fbbc04");
  c.setAttribute("stroke", "#ffffff");
  c.setAttribute("stroke-width", 2);
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x); t.setAttribute("y", y + 5);
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("font-family", "Arial, sans-serif");
  t.setAttribute("font-size", "13");
  t.setAttribute("font-weight", "700");
  t.setAttribute("fill", "#202124");
  t.textContent = "▲";
  g.appendChild(sh); g.appendChild(c); g.appendChild(t);
  overlaySvg.appendChild(g);
}

// ── Search / autocomplete ─────────────────────────────────────────────────────
function setupSearch(inputId, suggestionsId, hiddenId) {
  const input = document.getElementById(inputId);
  const list  = document.getElementById(suggestionsId);
  const hidden= document.getElementById(hiddenId);

  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    list.innerHTML = "";
    if (!q) { list.style.display = "none"; return; }
    const matches = LOCATIONS.filter(l =>
      l.name.toLowerCase().includes(q) || l.id.toLowerCase().includes(q)
    ).slice(0, 12);
    if (!matches.length) { list.style.display = "none"; return; }
    matches.forEach(loc => {
      const row = document.createElement("div");
      row.className = "suggestion-row";
      row.innerHTML = `<span>${loc.name}</span><span class="floor-chip">Fl ${loc.floor}</span>`;
      row.addEventListener("mousedown", e => {
        e.preventDefault();
        input.value = loc.name;
        hidden.value = loc.id;
        list.style.display = "none";
      });
      list.appendChild(row);
    });
    list.style.display = "block";
  });

  input.addEventListener("blur", () => {
    setTimeout(() => { list.style.display = "none"; }, 150);
  });
}

setupSearch("startSearch", "startSuggestions", "startKey");
setupSearch("endSearch",   "endSuggestions",   "endKey");

// ── Route generation ──────────────────────────────────────────────────────────
document.getElementById("routeBtn").addEventListener("click", generateRoute);

function generateRoute() {
  const startId = document.getElementById("startKey").value;
  const endId   = document.getElementById("endKey").value;

  hideStatus();
  if (!startId || !endId) {
    showStatus("Please select both a start and destination from the suggestions.", "error");
    return;
  }
  if (startId === endId) {
    showStatus("Start and destination are the same location.", "error");
    return;
  }

  const startLoc = LOCATIONS.find(l => l.id === startId);
  const endLoc   = LOCATIONS.find(l => l.id === endId);
  if (!startLoc || !endLoc) {
    showStatus("Location not found. Please re-select from the suggestions.", "error");
    return;
  }

  const crossFloors = startLoc.floor !== endLoc.floor;
  const legs = [];
  const steps = [];
  let idx = 1;

  if (!crossFloors) {
    const elvStart = ELEVATORS[startLoc.floor];
    legs.push({
      floor: startLoc.floor,
      from: { x: startLoc.x, y: startLoc.y },
      to:   { x: endLoc.x,   y: endLoc.y   },
    });
    steps.push({ n: idx++, html: `Depart <b>${startLoc.name}</b> and walk to your destination on the same floor.` });
    steps.push({ n: idx++, html: `Arrive at <b>${endLoc.name}</b>.` });
  } else {
    const elvS = ELEVATORS[startLoc.floor];
    const elvE = ELEVATORS[endLoc.floor];
    legs.push({
      floor: startLoc.floor,
      from: { x: startLoc.x, y: startLoc.y },
      to:   { x: elvS.x,     y: elvS.y     },
    });
    legs.push({
      floor: endLoc.floor,
      from: { x: elvE.x,   y: elvE.y   },
      to:   { x: endLoc.x, y: endLoc.y },
    });
    steps.push({ n: idx++, html: `Proceed from <b>${startLoc.name}</b> (Floor ${startLoc.floor}) to the <b>elevator</b>.` });
    steps.push({ n: idx++, html: `Take elevator to <b>Floor ${endLoc.floor}</b>.` });
    steps.push({ n: idx++, html: `Exit elevator and walk to <b>${endLoc.name}</b>.` });
  }

  route = { startId, endId, crossFloors, legs };

  // Switch to start floor and render
  switchFloor(startLoc.floor, false);
  loadFloor(startLoc.floor, () => {
    syncOverlay();
    // Fly-to effect: zoom toward start pin
    zoomScale = 1.3;
    applyZoom();
  });

  // Show elevator popup for cross-floor
  if (crossFloors) {
    document.getElementById("elevBody").textContent =
      `Going from Floor ${startLoc.floor} → Floor ${endLoc.floor}.`;
    document.getElementById("elevGotoBtn").textContent =
      `Switch to Floor ${endLoc.floor}`;
    document.getElementById("elevGotoBtn").onclick = () => {
      switchFloor(endLoc.floor, true);
      hideElevPopup();
    };
    elevPopup.classList.add("visible");
  }

  // Render steps
  stepsContainer.innerHTML = "";
  steps.forEach(s => {
    const div = document.createElement("div");
    div.className = "step";
    div.innerHTML = `<span class="step-num">${s.n}</span><span>${s.html}</span>`;
    stepsContainer.appendChild(div);
  });
  directionsDiv.style.display = "block";
}

// ── Elevator popup ────────────────────────────────────────────────────────────
document.getElementById("elevClose").addEventListener("click", hideElevPopup);
function hideElevPopup() { elevPopup.classList.remove("visible"); }

// ── Status helpers ────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  statusBar.textContent = msg;
  statusBar.className = `status-bar ${type}`;
}
function hideStatus() {
  statusBar.className = "status-bar";
  statusBar.textContent = "";
}

// ── Style: dash animation injected dynamically ────────────────────────────────
const styleTag = document.createElement("style");
styleTag.textContent = `
  @keyframes dash-anim {
    from { stroke-dashoffset: 54; }
    to   { stroke-dashoffset:  0; }
  }
`;
document.head.appendChild(styleTag);

// ── Init ──────────────────────────────────────────────────────────────────────
loadFloor(1);
</script>
